<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Icon do dự án tự vẽ (không dùng icon của bên thứ ba): kính lúp soi hộp 3D (cuboid) trên đám điểm point cloud. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.12"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- đám điểm point cloud -->
  <g fill="#94a3b8" opacity="0.75">
    <circle cx="22" cy="104" r="2.4"/><circle cx="32" cy="112" r="2"/><circle cx="14" cy="92" r="2"/>
    <circle cx="108" cy="22" r="2.4"/><circle cx="98" cy="14" r="2"/><circle cx="116" cy="34" r="2"/>
    <circle cx="104" cy="112" r="2.2"/><circle cx="20" cy="26" r="2.2"/>
  </g>
  <!-- tay cầm kính lúp -->
  <line x1="80" y1="80" x2="106" y2="106" stroke="#f59e0b" stroke-width="13" stroke-linecap="round"/>
  <line x1="84" y1="84" x2="102" y2="102" stroke="#fde68a" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- mặt kính -->
  <circle cx="54" cy="54" r="31" fill="url(#glass)" stroke="#38bdf8" stroke-width="9"/>
  <path d="M33 44 A24 24 0 0 1 48 31" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- hộp 3D (cuboid) trong kính -->
  <g fill="none" stroke="#22c55e" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="39" y="52" width="22" height="19"/>
    <rect x="47" y="43" width="22" height="19"/>
    <line x1="39" y1="52" x2="47" y2="43"/><line x1="61" y1="52" x2="69" y2="43"/>
    <line x1="39" y1="71" x2="47" y2="62"/><line x1="61" y1="71" x2="69" y2="62"/>
  </g>
</svg>
